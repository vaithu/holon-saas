# Billing - Invoice and Subscription Property Labels
# Used by InvoiceProperties and SubscriptionProperties PropertySets

# ── Invoice Properties ─────────────────────────────────────────────────────────

invoice.invoice_id=Invoice #
invoice.tenant_id=Tenant
invoice.amount_due=Amount Due
invoice.currency=Currency
invoice.status=Status
invoice.issued_at=Issued
invoice.paid_at=Paid On
invoice.external_ref=External Reference

invoice.invoice_id.help=Unique invoice identifier
invoice.tenant_id.help=The tenant this invoice belongs to
invoice.amount_due.help=Total amount due for this invoice
invoice.currency.help=ISO 4217 currency code (e.g., USD, EUR)
invoice.status.help=Payment status: OPEN, PAID, PAST_DUE, or VOID
invoice.issued_at.help=When this invoice was issued
invoice.paid_at.help=When this invoice was paid
invoice.external_ref.help=Reference from external billing system (e.g., Stripe)

# Invoice status values
invoice.status.OPEN=Open
invoice.status.PAID=Paid
invoice.status.PAST_DUE=Past Due
invoice.status.VOID=Void

