# Tenant User - Property Labels and Help Text
# Used by TenantUserProperties PropertySet

user.id=User ID
user.user_id=User ID
user.tenant_id=Tenant
user.email=Email
user.display_name=Display Name
user.role=Role
user.status=Status
user.created_at=Created At
user.last_login_at=Last Login

# Help text for form tooltips
user.id.help=Unique identifier for this user in this tenant
user.user_id.help=Global user identifier across all tenants
user.tenant_id.help=The tenant this user belongs to
user.email.help=User email address (must be unique per tenant)
user.display_name.help=User display name shown in the UI (optional)
user.role.help=User role determining permissions: VIEWER, MEMBER, ADMIN, or OWNER
user.status.help=User membership status: INVITED, ACTIVE, SUSPENDED, or REMOVED
user.created_at.help=When user was added to this tenant
user.last_login_at.help=When user last successfully logged in

# Tenant roles
user.role.VIEWER=Viewer
user.role.MEMBER=Member
user.role.ADMIN=Admin
user.role.OWNER=Owner

# User status
user.status.INVITED=Invited
user.status.ACTIVE=Active
user.status.SUSPENDED=Suspended
user.status.REMOVED=Removed

# Role descriptions for help
user.role.VIEWER.description=Can only view data, no editing
user.role.MEMBER.description=Can view and edit own data
user.role.ADMIN.description=Can manage users and settings
user.role.OWNER.description=Full access, can manage billing

